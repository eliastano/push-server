<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pokédex PWA - Offline & Push</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e11d48" />
    <meta name="description" content="PWA Pokédex con soporte offline y notificaciones push consumiendo PokeAPI" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Debes habilitar JavaScript para ejecutar esta aplicación.</noscript>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/ngsw-worker.js', { scope: '/' })
            .then(function (reg) {
              console.log('[PWA] Service Worker registrado con éxito. Scope:', reg.scope);
            })
            .catch(function (err) {
              console.error('[PWA] Error al registrar el Service Worker:', err);
            });
        });
      } else {
        console.warn('[PWA] Este navegador no soporta Service Workers.');
      }
    </script>
  </body>
</html>
